server:
  port: 10000
spring:
  application:
    name: auth-server
  security:
    oauth2:
      authorizationserver:
        issuer: http://auth-server:10000

        client:
          dam-client:
            registration:
              client-id: dam-client
              client-secret: "{noop}secret"
              client-name: DAM Client
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://127.0.0.1:8081/login/oauth2/code/dam-client-oidc
                - http://127.0.0.1:8081/authorized
              scopes:
                - openid
                - articles.read